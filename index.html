  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:    #c0392b;
      --blue:   #1a6ec4;
      --chrome: #b0bec5;
      --gold:   #c9a227;
      --dark:   #0a0a0b;
      --darker: #060608;
      --mid:    #141418;
      --light:  #e8e8e8;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--darker);
      color: var(--light);
      font-family: 'Crimson Pro', Georgia, serif;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 9999;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2.5rem;
      background: linear-gradient(to bottom, rgba(6,6,8,0.97), transparent);
      border-bottom: 1px solid rgba(192,57,43,0.15);
      gap: 1rem;
    }

    nav .nav-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      color: var(--chrome);
      text-decoration: none;
      white-space: nowrap;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    nav ul a {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--chrome);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav ul a:hover { color: #fff; }

    /* ── SOCIAL ICONS ── */
    .social-links {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(176,190,197,0.25);
      border-radius: 50%;
      text-decoration: none;
      color: var(--chrome);
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }

    .social-link:hover {
      border-color: var(--chrome);
      background: rgba(176,190,197,0.1);
      transform: translateY(-2px);
      color: #fff;
    }

    .social-link svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* ── HERO ── */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 6rem 2rem 4rem;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(26,110,196,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 30% 70%, rgba(192,57,43,0.07) 0%, transparent 60%),
        var(--darker);
    }

    #hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -55deg,
        transparent, transparent 60px,
        rgba(192,57,43,0.025) 60px, rgba(192,57,43,0.025) 62px
      );
      pointer-events: none;
    }

    .hero-logo {
      width: min(420px, 82vw);
      filter: drop-shadow(0 0 40px rgba(26,110,196,0.4)) drop-shadow(0 0 80px rgba(192,57,43,0.2));
      animation: floatLogo 6s ease-in-out infinite, fadeIn 1.2s ease both;
      position: relative;
      z-index: 2;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-tagline {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--chrome);
      margin-top: 2rem;
      animation: fadeIn 1.2s ease 0.3s both;
      position: relative;
      z-index: 2;
    }

    .hero-tagline span {
      display: inline-block;
      width: 40px;
      height: 1px;
      background: var(--red);
      vertical-align: middle;
      margin: 0 14px;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      margin-top: 2.4rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeIn 1.2s ease 0.6s both;
      position: relative;
      z-index: 2;
    }

    .hero-social {
      display: flex;
      gap: 1rem;
      margin-top: 1.6rem;
      justify-content: center;
      animation: fadeIn 1.2s ease 0.9s both;
      position: relative;
      z-index: 2;
    }

    .hero-social .social-link {
      width: 44px;
      height: 44px;
    }

    .hero-social .social-link svg {
      width: 19px;
      height: 19px;
    }

    /* ── BUTTONS ── */
    .btn {
      font-family: 'Oswald', sans-serif;
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0.85rem 2.2rem;
      border: none;
      cursor: pointer;
      transition: all 0.25s;
      display: inline-block;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    }

    .btn-primary:hover {
      background: #e74c3c;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(192,57,43,0.5);
    }

    .btn-outline {
      background: transparent;
      color: var(--chrome);
      border: 1px solid rgba(176,190,197,0.4);
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    }

    .btn-outline:hover {
      border-color: var(--chrome);
      color: #fff;
      background: rgba(176,190,197,0.07);
      transform: translateY(-2px);
    }

    /* ── SECTIONS ── */
    section { padding: 6rem 2rem; }

    .section-label {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--red);
      text-align: center;
      margin-bottom: 0.6rem;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: 0.06em;
      text-align: center;
      color: #fff;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .section-sub {
      font-size: 1.05rem;
      color: rgba(232,232,232,0.55);
      text-align: center;
      max-width: 480px;
      margin: 0 auto 3.5rem;
      font-style: italic;
      line-height: 1.7;
    }

    /* ── SERVICES ── */
    #services {
      background: var(--mid);
      position: relative;
    }

    #services::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--red), transparent);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1px;
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(192,57,43,0.12);
      border: 1px solid rgba(192,57,43,0.12);
    }

    .service-card {
      background: var(--mid);
      padding: 2.5rem 2rem;
      text-align: center;
      transition: background 0.3s;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--red);
      transform: scaleX(0);
      transition: transform 0.3s;
    }

    .service-card:hover { background: rgba(192,57,43,0.06); }
    .service-card:hover::before { transform: scaleX(1); }

    .service-icon { font-size: 2rem; margin-bottom: 1rem; display: block; }

    .service-name {
      font-family: 'Oswald', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .service-desc { font-size: 0.9rem; color: rgba(232,232,232,0.5); line-height: 1.6; }

    /* ── ABOUT ── */
    #about { background: var(--darker); }

    .about-inner {
      max-width: 860px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .about-text h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.08em;
      color: #fff;
      margin-bottom: 1.2rem;
    }

    .about-text p {
      font-size: 1.05rem;
      color: rgba(232,232,232,0.65);
      line-height: 1.85;
      margin-bottom: 1rem;
    }

    .about-text p strong { color: var(--chrome); font-style: italic; }

    .about-badge {
      background: var(--mid);
      border: 1px solid rgba(192,57,43,0.25);
      padding: 2.5rem;
      text-align: center;
      position: relative;
    }

    .about-badge::before, .about-badge::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-color: var(--red);
      border-style: solid;
    }
    .about-badge::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
    .about-badge::after  { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

    .badge-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.5rem;
      line-height: 1;
      color: var(--red);
      letter-spacing: 0.04em;
    }

    .badge-sub {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 0.78rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--chrome);
      margin-top: 0.5rem;
    }

    .badge-divider { width: 40px; height: 1px; background: var(--gold); margin: 1rem auto; }

    /* ── BARBER POLE ── */
    .pole {
      width: 4px;
      height: 60px;
      background: repeating-linear-gradient(
        to bottom,
        var(--red) 0px, var(--red) 10px,
        #fff 10px, #fff 20px,
        var(--blue) 20px, var(--blue) 30px
      );
      border-radius: 2px;
      margin: 0 auto 2rem;
      display: block;
      animation: poleSpin 3s linear infinite;
    }

    @keyframes poleSpin {
      from { background-position: 0 0; }
      to   { background-position: 0 30px; }
    }

    /* ── CONTACT ── */
    #contact {
      background: var(--mid);
      position: relative;
    }

    #contact::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--blue), transparent);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .contact-card {
      background: var(--darker);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 2.2rem;
      transition: border-color 0.3s, transform 0.3s;
    }

    .contact-card:hover {
      border-color: rgba(26,110,196,0.4);
      transform: translateY(-4px);
    }

    .contact-card-icon { font-size: 1.5rem; margin-bottom: 1rem; display: block; }

    .contact-card-label {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 0.6rem;
    }

    .contact-card-value { font-size: 1.05rem; color: #fff; line-height: 1.6; }
    .contact-card-value a { color: inherit; text-decoration: none; }
    .contact-card-value a:hover { color: var(--chrome); }

    /* Hours table */
    .hours-table { width: 100%; border-collapse: collapse; }

    .hours-table td {
      font-size: 0.92rem;
      padding: 0.28rem 0;
      color: rgba(232,232,232,0.7);
      line-height: 1.5;
    }

    .hours-table td:first-child {
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--chrome);
      padding-right: 1.2rem;
      white-space: nowrap;
    }

    .hours-table tr.today td { color: #fff; }
    .hours-table tr.today td:first-child { color: var(--gold); }
    .hours-closed { color: rgba(192,57,43,0.65) !important; font-style: italic; }

    /* Social card row */
    .social-card-row {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.4rem;
    }

    .social-card-row .social-link {
      width: 42px;
      height: 42px;
    }

    .social-card-row .social-link svg {
      width: 17px;
      height: 17px;
    }

    /* Walk-in banner */
    .walkin-banner {
      max-width: 960px;
      margin: 2.5rem auto 0;
      background: linear-gradient(135deg, rgba(192,57,43,0.15), rgba(26,110,196,0.15));
      border: 1px solid rgba(192,57,43,0.3);
      padding: 1.6rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    }

    .walkin-icon { font-size: 1.6rem; flex-shrink: 0; }

    .walkin-text {
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--light);
    }

    .walkin-text span { color: var(--gold); font-weight: 600; }

    /* ── MAP ── */
    #map {
      background: var(--darker);
      padding: 0;
      height: 340px;
      position: relative;
      overflow: hidden;
    }

    #map iframe {
      width: 100%;
      height: 100%;
      border: none;
      filter: grayscale(1) invert(1) contrast(0.85) brightness(0.8) hue-rotate(180deg);
      opacity: 0.8;
    }

    .map-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(6,6,8,0.7) 0%, transparent 35%, transparent 65%, rgba(6,6,8,0.7) 100%),
        linear-gradient(to bottom, rgba(6,6,8,0.5) 0%, transparent 30%);
      pointer-events: none;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--darker);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 2rem;
      text-align: center;
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .footer-social { display: flex; gap: 0.75rem; }

    .footer-social .social-link {
      width: 32px;
      height: 32px;
      border-color: rgba(176,190,197,0.15);
    }

    .footer-social .social-link svg { width: 13px; height: 13px; }

    footer p {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(176,190,197,0.35);
    }

    footer p a { color: rgba(176,190,197,0.5); text-decoration: none; }

    /* ── RESPONSIVE ── */
    @media (max-width: 760px) {
      nav ul { display: none; }
      .about-inner { grid-template-columns: 1fr; gap: 2.5rem; }
      .about-badge { max-width: 280px; margin: 0 auto; }
      .walkin-banner { clip-path: none; flex-direction: column; text-align: center; }
    }
  </style>
</head>
